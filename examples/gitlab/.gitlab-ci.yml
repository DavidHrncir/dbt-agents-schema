# Example caller: copy to .gitlab-ci.yml in your dbt project repository (or merge the
# `include` entry into yours). Checks merge requests (findings appear in the Code Quality
# widget) and publishes on the default branch. Add `parse_target` to the prod
# environment in agents_schema.yml so `dbt parse` sees production names without a real
# credential. Set the CI/CD variable WAREHOUSE_CREDENTIALS (type File, protected; see
# the template header). Pin the URL to a release tag and set package_version to it.
# Alternatives: `include: project: <group>/dbt-agents-schema` with `ref: v0.2.1` and
# `file: templates/gitlab/dbt-agents-schema.yml`, or a local copy with `include: local:`.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - remote: https://raw.githubusercontent.com/DavidHrncir/dbt-agents-schema/v0.2.1/templates/gitlab/dbt-agents-schema.yml
    inputs:
      package_version: "0.2.1"
      warehouse: snowflake
      environment: prod
      # dbt_engine: core            # dbt-core instead of dbt Fusion; installs dbt-snowflake
