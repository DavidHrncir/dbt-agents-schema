# GitLab CI template: check or publish a dbt project's metadata to its agents schema.
# SPEC 10.2. Holds no publishing logic: it installs a pinned dbt-agents-schema, runs
# `dbt deps` and `dbt parse`, then calls the CLI. Use it with `include: remote:` (raw URL
# pinned to a tag), `include: project:`, or copy it into your repository. It does not
# use the GitLab CI/CD Catalog. Example: examples/gitlab/.gitlab-ci.yml.
#
# Variables (Settings > CI/CD > Variables):
#   WAREHOUSE_CREDENTIALS  required to publish. Use type "File" and mark it protected so
#                          only default-branch pipelines receive it. GitLab cannot mask a
#                          multi-line JSON/YAML document, so do not rely on masking.
#   DBT_PROFILES_YML       optional profiles.yml (plain or file type) for `dbt parse`.
#                          With a protected WAREHOUSE_CREDENTIALS, set this (unprotected)
#                          for merge request checks: the output of
#                          `dbt-agents-schema write-parse-profile` holds no secrets.
# Both are removed from the environment before `dbt deps` and `dbt parse` run.
spec:
  inputs:
    project_dir:
      description: dbt project directory, relative to the repository root.
      default: "."
    package_version:
      description: Exact dbt-agents-schema version to install, for example 0.1.0.
    python_version:
      description: Python version (selects the python:<version> image).
      default: "3.12"
    dbt_adapter:
      description: dbt adapter package.
      options: [dbt-snowflake, dbt-bigquery, dbt-databricks, dbt-duckdb]
    dbt_version:
      description: dbt-core version specifier.
      default: ">=1.8,<2"
    mode:
      description: "auto: check on merge requests and publish on the default branch; check or publish: only that job."
      options: [auto, check, publish]
      default: auto
    environment:
      description: Environment name from agents_schema.yml, used by publish.
      default: prod
---
.dbt-agents-schema-base:
  image: python:$[[ inputs.python_version ]]
  variables:
    PROJECT_DIR: "$[[ inputs.project_dir ]]"
    DBT_ADAPTER: "$[[ inputs.dbt_adapter ]]"
    DBT_VERSION: "$[[ inputs.dbt_version ]]"
    AGENTS_ENVIRONMENT: "$[[ inputs.environment ]]"
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - EXTRA="${DBT_ADAPTER#dbt-}"
    - python -m pip install "dbt-core${DBT_VERSION}" "${DBT_ADAPTER}" "dbt-agents-schema[${EXTRA}]==$[[ inputs.package_version ]]"
    - dbt --version
    - dbt-agents-schema --version
    - |
      # A file-type variable holds a path; the CLI expects the document itself.
      if [ -n "${WAREHOUSE_CREDENTIALS:-}" ] && [ -f "$WAREHOUSE_CREDENTIALS" ]; then
        WAREHOUSE_CREDENTIALS="$(cat "$WAREHOUSE_CREDENTIALS")"
      fi
      # Profile for `dbt parse`, kept outside the checkout so it is never uploaded.
      export DBT_PROFILES_DIR="$(mktemp -d)"
      if [ -n "${DBT_PROFILES_YML:-}" ]; then
        umask 077
        if [ -f "$DBT_PROFILES_YML" ]; then
          cp "$DBT_PROFILES_YML" "$DBT_PROFILES_DIR/profiles.yml"
        else
          printf '%s\n' "$DBT_PROFILES_YML" > "$DBT_PROFILES_DIR/profiles.yml"
        fi
      else
        dbt-agents-schema write-parse-profile --project-dir "$PROJECT_DIR" --out "$DBT_PROFILES_DIR"
      fi
      # Keep secrets out of the environment of `dbt deps` and `dbt parse`, which run
      # third-party package code. Publish gets the credentials back explicitly.
      _agents_schema_credentials="${WAREHOUSE_CREDENTIALS:-}"
      unset WAREHOUSE_CREDENTIALS DBT_PROFILES_YML
    - (cd "$PROJECT_DIR" && dbt deps && dbt parse)

dbt-agents-schema-check:
  extends: .dbt-agents-schema-base
  stage: test
  rules:
    - if: '"$[[ inputs.mode ]]" != "publish" && $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - dbt-agents-schema check --project-dir "$PROJECT_DIR" --format gitlab --output gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

dbt-agents-schema-publish:
  extends: .dbt-agents-schema-base
  stage: deploy
  rules:
    - if: '"$[[ inputs.mode ]]" != "check" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: dbt-agents-schema-$CI_PROJECT_PATH
  script:
    - |
      if [ -z "${_agents_schema_credentials:-}" ]; then
        echo "error: publish needs the WAREHOUSE_CREDENTIALS CI/CD variable (Settings > CI/CD > Variables)" >&2
        exit 2
      fi
    - WAREHOUSE_CREDENTIALS="$_agents_schema_credentials" dbt-agents-schema publish --project-dir "$PROJECT_DIR" --env "$AGENTS_ENVIRONMENT"
