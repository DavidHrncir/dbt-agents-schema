# Reusable workflow: check or publish a dbt project's metadata to its agents schema.
# SPEC 10, 10.1. Holds no publishing logic: it installs a pinned dbt-agents-schema and a
# pinned dbt engine, runs `dbt deps` and `dbt parse --no-partial-parse`, then calls the
# CLI. See examples/github/agents-schema.yml.
name: dbt-agents-schema

on:
  workflow_call:
    inputs:
      project-dir:
        description: dbt project directory, relative to the repository root.
        type: string
        default: "."
      python-version:
        description: Python version.
        type: string
        default: "3.12"
      mode:
        description: "`check` (annotate the pull request) or `publish`."
        type: string
        required: true
      environment:
        description: Environment name from agents_schema.yml. Used by check (--env) and publish.
        type: string
        default: prod
      warehouse:
        description: "snowflake, bigquery, databricks or duckdb. Selects the package extra and, with dbt-core, the adapter. Required unless dbt-adapter is set."
        type: string
        default: ""
      dbt-engine:
        description: "`fusion` (dbt Fusion, the default) or `core` (dbt-core plus dbt-adapter)."
        type: string
        default: fusion
      dbt-fusion-version:
        description: dbt Fusion version installed with the official installer (dbt-engine fusion).
        type: string
        default: "2.0.0"
      dbt-version:
        description: dbt-core version specifier (dbt-engine core).
        type: string
        default: ">=1.8,<2"
      dbt-adapter:
        description: dbt adapter package (dbt-engine core). Default dbt-<warehouse>. A v0.1 caller that sets only dbt-adapter gets the warehouse derived from it.
        type: string
        default: ""
      package-version:
        description: Exact dbt-agents-schema version to install, for example 0.2.0. Required unless package-spec is set.
        type: string
        default: ""
      package-spec:
        description: "Full pip requirement for dbt-agents-schema, such as a git URL pinned to a commit. Replaces package-version. A bare URL gets the warehouse extra added."
        type: string
        default: ""
      parse-env:
        description: "Lines of KEY=VALUE exported to every later step, for env_var() at parse time. Not for secrets: values are not masked."
        type: string
        default: ""
    secrets:
      WAREHOUSE_CREDENTIALS:
        description: Warehouse credentials document. Required for publish; given only to the publish steps.
        required: false
      DBT_PROFILES_YML:
        description: Optional profiles.yml for `dbt parse`. When absent, write-parse-profile --env builds a placeholder profile from the environment's parse_target.
        required: false
      PACKAGE_REPO_TOKEN:
        description: Optional read-only token for installing package-spec from a private git repository. Given only to the install step.
        required: false

permissions:
  contents: read

jobs:
  dbt-agents-schema:
    name: dbt-agents-schema ${{ inputs.mode }}
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: ${{ inputs.project-dir }}
      MODE: ${{ inputs.mode }}
      AGENTS_ENVIRONMENT: ${{ inputs.environment }}
      # Secrets are passed only to the steps that need them (install, profile, publish),
      # never to `dbt deps` or `dbt parse`, which run third-party package code.
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Validate inputs
        shell: bash
        env:
          HAS_WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS != '' }}
          WAREHOUSE: ${{ inputs.warehouse }}
          DBT_ENGINE: ${{ inputs.dbt-engine }}
          DBT_ADAPTER: ${{ inputs.dbt-adapter }}
          PACKAGE_VERSION: ${{ inputs.package-version }}
          PACKAGE_SPEC: ${{ inputs.package-spec }}
          PARSE_ENV: ${{ inputs.parse-env }}
        run: |
          fail() { echo "::error::$1"; exit 2; }
          case "$MODE" in
            check|publish) ;;
            *) fail "input mode must be 'check' or 'publish', got '$MODE'" ;;
          esac
          wh="$WAREHOUSE"
          if [ -z "$wh" ]; then
            [ -n "$DBT_ADAPTER" ] || fail "set input warehouse (snowflake, bigquery, databricks or duckdb)"
            wh="${DBT_ADAPTER#dbt-}"
          fi
          case "$wh" in
            snowflake|bigquery|databricks|duckdb) ;;
            *) fail "input warehouse must be one of snowflake, bigquery, databricks, duckdb; got '$wh' (from warehouse or dbt-adapter)" ;;
          esac
          case "$DBT_ENGINE" in
            fusion|core) ;;
            *) fail "input dbt-engine must be 'fusion' or 'core', got '$DBT_ENGINE'" ;;
          esac
          if [ -n "$PACKAGE_SPEC" ]; then
            case "$PACKAGE_SPEC" in
              *" @ "*|dbt-agents-schema*) requirement="$PACKAGE_SPEC" ;;
              *://*) requirement="dbt-agents-schema[$wh] @ $PACKAGE_SPEC" ;;
              *) fail "input package-spec must be a pip requirement or a URL such as git+https://github.com/OWNER/dbt-agents-schema@COMMIT" ;;
            esac
          elif [ -n "$PACKAGE_VERSION" ]; then
            requirement="dbt-agents-schema[$wh]==$PACKAGE_VERSION"
          else
            fail "set input package-version (for example 0.2.0) or package-spec"
          fi
          if [ "$MODE" = publish ] && [ "$HAS_WAREHOUSE_CREDENTIALS" != true ]; then
            fail "mode publish needs the WAREHOUSE_CREDENTIALS secret; pass it from the caller under secrets:"
          fi
          # parse-env: KEY=VALUE lines exported to every later step.
          while IFS= read -r line || [ -n "$line" ]; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            case "$trimmed" in ''|'#'*) continue ;; esac
            case "$trimmed" in *=*) ;; *) fail "parse-env line '$trimmed' is not KEY=VALUE" ;; esac
            key="${trimmed%%=*}"
            value="${trimmed#*=}"
            [[ "$key" =~ ^[A-Z_][A-Z0-9_]*$ ]] || fail "parse-env key '$key' must match ^[A-Z_][A-Z0-9_]*\$"
            case "$key" in
              WAREHOUSE_CREDENTIALS|DBT_PROFILES_YML|DBT_PROFILES_DIR|PACKAGE_REPO_TOKEN|GITHUB_*|RUNNER_*)
                fail "parse-env key '$key' is reserved; pass secrets under secrets: and do not override GITHUB_* or RUNNER_* variables" ;;
            esac
            delimiter="EOF_$(openssl rand -hex 16 2>/dev/null || echo $RANDOM$RANDOM$RANDOM)"
            printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
          done <<< "$PARSE_ENV"
          {
            echo "AGENTS_WAREHOUSE=$wh"
            echo "AGENTS_DBT_ADAPTER=${DBT_ADAPTER:-dbt-$wh}"
            echo "AGENTS_PACKAGE_REQUIREMENT=$requirement"
            # Outside the checkout, so the profile is never committed or uploaded.
            echo "DBT_PROFILES_DIR=$RUNNER_TEMP/dbt-agents-schema-profiles"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dbt and dbt-agents-schema
        shell: bash
        env:
          PACKAGE_REPO_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
          DBT_ENGINE: ${{ inputs.dbt-engine }}
          DBT_FUSION_VERSION: ${{ inputs.dbt-fusion-version }}
          DBT_VERSION: ${{ inputs.dbt-version }}
        run: |
          python -m pip install --upgrade pip
          if [ -n "$PACKAGE_REPO_TOKEN" ]; then
            # Global git config (outside the checkout), removed again before this step ends.
            rule="url.https://x-access-token:${PACKAGE_REPO_TOKEN}@github.com/.insteadOf"
            trap 'git config --global --unset-all "$rule" || true' EXIT
            git config --global "$rule" "https://github.com/"
          fi
          python -m pip install "$AGENTS_PACKAGE_REQUIREMENT"
          if [ -n "$PACKAGE_REPO_TOKEN" ]; then
            git config --global --unset-all "$rule"
            trap - EXIT
          fi
          if [ "$DBT_ENGINE" = core ]; then
            python -m pip install "dbt-core${DBT_VERSION}" "$AGENTS_DBT_ADAPTER"
          else
            curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh \
              | sh -s -- --update --version "$DBT_FUSION_VERSION"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          dbt --version
          dbt-agents-schema --version

      - name: Write profiles.yml for dbt parse
        shell: bash
        env:
          DBT_PROFILES_YML: ${{ secrets.DBT_PROFILES_YML }}
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          if [ -n "$DBT_PROFILES_YML" ]; then
            umask 077
            printf '%s\n' "$DBT_PROFILES_YML" > "$DBT_PROFILES_DIR/profiles.yml"
          elif ! dbt-agents-schema write-parse-profile --project-dir "$PROJECT_DIR" \
              --env "$AGENTS_ENVIRONMENT" --out "$DBT_PROFILES_DIR"; then
            echo "::error::cannot write a parse profile: add parse_target to environments.$AGENTS_ENVIRONMENT in agents_schema.yml, or pass the DBT_PROFILES_YML secret"
            exit 2
          fi

      - name: dbt deps
        shell: bash
        working-directory: ${{ inputs.project-dir }}
        run: dbt deps

      - name: dbt parse
        shell: bash
        working-directory: ${{ inputs.project-dir }}
        run: dbt parse --no-partial-parse

      - name: Check
        if: inputs.mode == 'check'
        shell: bash
        run: dbt-agents-schema check --project-dir "$PROJECT_DIR" --env "$AGENTS_ENVIRONMENT" --format github

      - name: Publish (dry run)
        if: inputs.mode == 'publish'
        shell: bash
        env:
          WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
        run: dbt-agents-schema publish --project-dir "$PROJECT_DIR" --env "$AGENTS_ENVIRONMENT" --dry-run

      - name: Publish
        if: inputs.mode == 'publish'
        shell: bash
        env:
          WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
        run: dbt-agents-schema publish --project-dir "$PROJECT_DIR" --env "$AGENTS_ENVIRONMENT"

      - name: Remove profiles.yml
        if: always()
        shell: bash
        run: rm -rf "${DBT_PROFILES_DIR:?}"
